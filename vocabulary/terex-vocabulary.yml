name: Terex Vocabulary
description: >-
  Core vocabulary and taxonomy for Terex Corporation, the global manufacturer
  of aerial work platforms and materials processing equipment. Covers equipment
  categories, digital solutions, telematics, and operational concepts.
created: '2026-05-03'
modified: '2026-05-03'
terms:
  - term: Aerial Work Platform
    definition: >-
      Elevated work platforms including boom lifts, scissor lifts, and
      telehandlers used in construction, maintenance, and industrial applications.
      A primary Terex product segment through the Genie brand.
    tags:
      - Products
      - Equipment Categories

  - term: Materials Processing
    definition: >-
      Equipment for crushing, screening, and washing aggregate materials.
      Terex's materials processing segment includes Powerscreen, Terex Finlay,
      and other crushing/screening equipment brands.
    tags:
      - Products
      - Equipment Categories

  - term: Telematics
    definition: >-
      Remote monitoring technology that collects and transmits real-time machine
      data including location, operating hours, fuel consumption, fault codes,
      and utilization. Available via MyTerex platform.
    tags:
      - Digital Solutions
      - IoT

  - term: MyTerex
    definition: >-
      Terex's dealer and customer portal providing access to product technical
      information, marketing materials, telematics data, and eVentory inventory
      management.
    tags:
      - Digital Solutions
      - Platform

  - term: Connect by Terex
    definition: >-
      Terex's mobile application enabling technicians to diagnose equipment
      issues remotely using live video and augmented reality annotations.
    tags:
      - Digital Solutions
      - Mobile

  - term: Ask Terex
    definition: >-
      Terex's AI-powered multilingual support platform trained on Terex
      documentation and data, providing rapid technical responses to equipment
      questions.
    tags:
      - Digital Solutions
      - AI

  - term: Connected Dealer Inventory
    definition: >-
      CDI uses machine telemetry to predict parts requirements and optimize
      dealer inventory levels, reducing downtime from parts unavailability.
    tags:
      - Digital Solutions
      - Supply Chain

  - term: Engine Hours
    definition: >-
      The total number of hours a piece of equipment's engine has been running.
      A primary metric for maintenance scheduling and equipment valuation in
      the construction industry.
    tags:
      - Metrics
      - Maintenance

  - term: Uptime
    definition: >-
      The percentage of time equipment is operational and available for work.
      Maximizing machine uptime is a central goal of Terex's digital solutions.
    tags:
      - Metrics
      - Operations

  - term: Predictive Maintenance
    definition: >-
      Using telematics data and ML algorithms to predict equipment failures
      before they occur, enabling proactive maintenance scheduling. A key
      capability of the Terex digital solutions platform.
    tags:
      - Digital Solutions
      - Maintenance

  - term: Fleet Management
    definition: >-
      The process of managing a portfolio of construction or industrial equipment
      to maximize utilization and minimize costs. Terex's MyTerex app provides
      fleet management dashboards.
    tags:
      - Operations
      - Fleet

  - term: OEM
    definition: >-
      Original Equipment Manufacturer. Terex manufactures equipment sold under
      its own brands (Genie, Powerscreen, Terex Utilities) as OEM products for
      construction and industrial markets.
    tags:
      - Business
      - Manufacturing

  - term: Genie
    definition: >-
      Terex's primary brand for aerial work platforms including boom lifts,
      scissor lifts, and material lifts used globally in construction and
      industrial maintenance.
    tags:
      - Brands
      - Products

  - term: Fault Code
    definition: >-
      A diagnostic code generated by equipment onboard electronics indicating
      a specific system error or warning condition. Fault codes are transmitted
      via telematics for remote diagnosis.
    tags:
      - Diagnostics
      - Telematics
